name: Selenium Cucumber Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1' # weekly regression run, Monday 04:00 UTC

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run tests (${{ matrix.browser }})
        run: mvn -B test -Dbrowser=${{ matrix.browser }} -Dheadless=true
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: cucumber-report-${{ matrix.browser }}
          path: |
            target/cucumber-report.html
            target/cucumber.json
            target/surefire-reports/
          retention-days: 14
      - name: Package Chrome report for GitHub Pages
        if: ${{ !cancelled() && matrix.browser == 'chrome' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        run: mkdir -p site && cp target/cucumber-report.html site/index.html
      - if: ${{ !cancelled() && matrix.browser == 'chrome' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/

  publish-report:
    name: Publish live test report
    needs: test
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
