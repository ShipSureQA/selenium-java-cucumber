name: Selenium Cucumber Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1' # weekly regression run, Monday 04:00 UTC

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run tests (${{ matrix.browser }})
        run: mvn -B test -Dbrowser=${{ matrix.browser }} -Dheadless=true
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: cucumber-report-${{ matrix.browser }}
          path: |
            target/cucumber-report.html
            target/cucumber.json
            target/surefire-reports/
          retention-days: 14
